<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Guide de l'application TARAN+ : analyse de cible, C50 Live, shot timer, râtelier, entretien, historique.">
<title>Guide TARAN+</title>
<style>
:root{
  --bg:#F2F4F6; --carte:#FFFFFF; --texte:#14181D; --discret:#5E6A76; --trait:#D9DEE3;
  --vert:#15803D; --orange:#E07B00; --voile:#E7EBEE; --sur-accent:#FFFFFF; --cible:#2B3138; --impact:#C0362C; --mur:#C9D0D6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1318; --carte:#1A2027; --texte:#F2F4F7; --discret:#9AA5B1; --trait:#2C353F;
  --vert:#3DDC84; --orange:#FF9500; --voile:#222A33; --sur-accent:#08130C; --cible:#C9D1D9; --impact:#FF6B6B; --mur:#3A4551; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1318; --carte:#1A2027; --texte:#F2F4F7; --discret:#9AA5B1; --trait:#2C353F;
  --vert:#3DDC84; --orange:#FF9500; --voile:#222A33; --sur-accent:#08130C; --cible:#C9D1D9; --impact:#FF6B6B; --mur:#3A4551; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texte);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;
  padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0 10px}
.logo{font-weight:800;font-size:18px;color:var(--texte);text-decoration:none}
.logo span{color:var(--vert)}
.bandeau{font-size:12px;color:var(--discret);background:var(--voile);border-radius:10px;padding:8px 12px;margin:0 0 16px}
h1{font-size:26px;line-height:1.2;margin:8px 0 6px}
h2{font-size:18px;margin:0 0 6px}
.chapo{color:var(--discret);margin:0 0 20px}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tuile{display:flex;flex-direction:column;gap:6px;background:var(--carte);border:1px solid var(--trait);border-radius:16px;padding:16px;color:inherit;text-decoration:none}
.tuile:hover,.tuile:focus-visible{border-color:var(--vert);outline:none}
.tuile .ico{width:40px;height:40px;border-radius:12px;background:var(--voile);display:grid;place-items:center;font-size:20px}
.tuile b{font-size:16px}
.tuile small{color:var(--discret);font-size:13px}
.retour{display:inline-block;color:var(--vert);text-decoration:none;font-weight:600;font-size:14px;padding:8px 0}
.scene{background:var(--carte);border:1px solid var(--trait);border-radius:16px;padding:12px;margin:12px 0}
.scene svg{width:100%;height:auto;display:block}
.scene svg text{fill:var(--discret);font-size:11px;font-family:inherit}
.legende{font-size:13px;color:var(--discret);margin:6px 4px 0;min-height:20px}
.etapes{display:flex;gap:6px;margin:6px 0 4px}
.etapes button{flex:1;height:8px;border:0;border-radius:4px;background:var(--trait);padding:0;cursor:pointer}
.etapes button.on{background:var(--vert)}
.nav{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:1px solid var(--trait);background:var(--carte);color:var(--texte);border-radius:12px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--vert);border-color:var(--vert);color:var(--sur-accent)}
.btn:disabled{opacity:.4;cursor:default}
.encart{border-left:3px solid var(--orange);background:var(--carte);border-radius:0 12px 12px 0;padding:10px 14px;margin:14px 0;font-size:14px}
.liste{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.liste div{background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:10px 14px}
.liste b{display:block}
footer{margin-top:28px;font-size:12px;color:var(--discret);text-align:center}
.lcd{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.onglets{display:flex;gap:6px;margin:0 0 10px}
.onglets button{flex:1;border:1px solid var(--trait);background:var(--carte);color:var(--texte);border-radius:12px;padding:10px;font:inherit;font-weight:600;cursor:pointer}
.onglets button[aria-pressed="true"]{background:var(--vert);border-color:var(--vert);color:var(--sur-accent)}
.scene svg .t-fort{fill:var(--texte);font-weight:600}
.commande{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;margin:12px 4px 0}
.commande label{font-weight:600;font-size:14px}
.commande output{font-variant-numeric:tabular-nums;font-weight:700;color:var(--vert)}
.commande input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--vert);margin:4px 0 8px}
.tableau{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;min-width:560px;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--trait)}
th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--discret)}
tr.stop td:first-child{color:var(--orange);font-weight:700}
.etapes-trace{display:flex;flex-direction:column;gap:8px;margin:10px 0;padding:0;list-style:none;counter-reset:e}
.etapes-trace li{counter-increment:e;background:var(--carte);border:1px solid var(--trait);border-radius:12px;padding:10px 14px 10px 46px;position:relative}
.etapes-trace li::before{content:counter(e);position:absolute;left:12px;top:10px;width:24px;height:24px;border-radius:50%;background:var(--voile);display:grid;place-items:center;font-weight:700;font-size:13px}
.etapes-trace b{display:block}
.tableau input{width:5.2em;font:inherit;font-variant-numeric:tabular-nums;color:var(--texte);background:var(--bg);border:1px solid var(--trait);border-radius:8px;padding:5px 6px}
.tableau input:focus-visible{outline:2px solid var(--vert);outline-offset:1px}
.tableau .u{color:var(--discret);margin-left:4px}
.cote{font-weight:600}
.scene svg .t-fort{fill:var(--texte);font-weight:600}
.scene svg.diy text{font-size:13px}
.scene #vue{overflow-x:auto}
.scene #vue svg{min-width:560px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="page">
<header>
  <a class="logo" href="#/">TARAN<span>+</span> <span style="color:var(--discret);font-weight:500;font-size:14px">le guide</span></a>
</header>
<main id="app"></main>
<footer>Guide TARAN+ · version de l'appli : 0.30.2 · <a href="#/" style="color:inherit">Sommaire</a></footer>
</div>

/* ---------- Scènes SVG ---------- */
function scene(type,p){
 if(type==="calibrage"){
  // p: 1 premier repère, 2 second, 3 distance. Animation CSS légère, rejouée à chaque étape.
  return `<svg viewBox="0 0 320 190" role="img" aria-label="Animation : on pose deux repères sur la cible, la distance s'affiche">
   <circle cx="160" cy="95" r="80" fill="none" stroke="var(--cible)" stroke-width="2"/>
   <circle cx="160" cy="95" r="55" fill="none" stroke="var(--cible)" stroke-width="1.5" opacity=".6"/>
   <circle cx="160" cy="95" r="22" fill="var(--cible)"/>
   <circle cx="132" cy="70" r="4" fill="var(--impact)"/><circle cx="170" cy="112" r="4" fill="var(--impact)"/><circle cx="150" cy="104" r="4" fill="var(--impact)"/>
   <g style="opacity:${p>=1?1:0}"><circle cx="80" cy="95" r="8" fill="var(--vert)" opacity=".25"><animate attributeName="r" values="4;11;8" dur=".6s" fill="freeze"/></circle><circle cx="80" cy="95" r="4" fill="var(--vert)"/></g>
   <g style="opacity:${p>=2?1:0}"><circle cx="240" cy="95" r="8" fill="var(--vert)" opacity=".25"><animate attributeName="r" values="4;11;8" dur=".6s" fill="freeze"/></circle><circle cx="240" cy="95" r="4" fill="var(--vert)"/></g>
   ${p>=3?`<line x1="80" y1="95" x2="240" y2="95" stroke="var(--vert)" stroke-width="2" stroke-dasharray="5 4"><animate attributeName="stroke-dashoffset" from="160" to="0" dur=".8s" fill="freeze"/></line>
   <rect x="128" y="64" width="64" height="22" rx="11" fill="var(--vert)"/><text x="160" y="79" text-anchor="middle" style="fill:var(--sur-accent);font-weight:700;font-size:12px">200 mm</text>`:""}
   <text x="8" y="182">${p===1?"Repère 1 : bord gauche":p===2?"Repère 2 : bord droit":"Échelle fixée"}</text>
  </svg>`;
 }
 if(type==="timer"){
  return `<svg viewBox="0 0 320 150" role="img" aria-label="Afficheur du shot timer">
   <rect x="20" y="14" width="280" height="84" rx="14" fill="var(--voile)" stroke="var(--trait)"/>
   <text id="lcd" x="160" y="72" text-anchor="middle" class="lcd" style="fill:var(--vert);font-size:44px">0,00</text>
   <text x="160" y="116" text-anchor="middle" id="lcdEtat">Prêt</text>
   <g id="coups"></g></svg>`;
 }
 if(type.startsWith("img:")){return `<div style="display:flex;justify-content:center"><img src="img/${type.slice(4)}.jpg" alt="Capture de l'appli" style="width:100%;max-width:270px;border-radius:22px;border:6px solid var(--cible);background:var(--cible);display:block"></div>`;}
 if(type==="cadre"){
  return `<svg viewBox="0 0 320 170" role="img" aria-label="Cadre autour de la cible">
   <rect x="90" y="12" width="140" height="146" rx="14" fill="none" stroke="var(--vert)" stroke-width="3" stroke-dasharray="14 8"><animate attributeName="stroke-dashoffset" from="0" to="44" dur="1.6s" repeatCount="indefinite"/></rect>
   <circle cx="160" cy="85" r="52" fill="none" stroke="var(--cible)" stroke-width="2"/><circle cx="160" cy="85" r="16" fill="var(--cible)"/></svg>`;
 }
 if(type==="impacts"){
  return `<svg viewBox="0 0 320 170" role="img" aria-label="Impacts détectés">
   <circle cx="160" cy="85" r="64" fill="none" stroke="var(--cible)" stroke-width="2"/><circle cx="160" cy="85" r="20" fill="var(--cible)"/>
   ${[[148,70],[172,78],[158,96],[181,92],[140,88]].map(([x,y],i)=>`<g><circle cx="${x}" cy="${y}" r="5" fill="var(--impact)"><animate attributeName="opacity" values="0;1" dur=".3s" begin="${i*.5}s" fill="freeze"/></circle></g>`).join("")}</svg>`;
 }
 if(type==="courbe"){
  return `<svg viewBox="0 0 320 130" role="img" aria-label="Courbe de progression">
   <g stroke="var(--trait)"><line x1="20" y1="20" x2="310" y2="20"/><line x1="20" y1="60" x2="310" y2="60"/><line x1="20" y1="100" x2="310" y2="100"/></g>
   <polyline fill="none" stroke="var(--vert)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="30,90 80,76 130,82 180,58 230,50 300,30" stroke-dasharray="400"><animate attributeName="stroke-dashoffset" from="400" to="0" dur="1.2s" fill="freeze"/></polyline>
   <circle cx="300" cy="30" r="5" fill="var(--vert)"/></svg>`;
 }
 return `<svg viewBox="0 0 320 150" role="img" aria-label="Exemple d'écran">
  <rect x="100" y="8" width="120" height="134" rx="16" fill="var(--voile)" stroke="var(--trait)"/>
  <rect x="112" y="24" width="96" height="14" rx="7" fill="var(--trait)"/><rect x="112" y="46" width="96" height="14" rx="7" fill="var(--trait)"/><rect x="112" y="68" width="60" height="14" rx="7" fill="var(--vert)"/>
  <text x="160" y="118" text-anchor="middle">capture de l'appli (à venir)</text></svg>`;
}

function pageDiy(){

 <div class="scene">

     <label for="haut">Hauteur du haut des cibles</label><output id="oHaut"></output>
     <input id="haut" type="range" min="100" max="200" step="1" value="152">
   </div>
   <p class="legende" id="leg"></p>
   <div class="nav"><button class="btn" id="raz">Remettre les valeurs du plan</button><button class="btn pri" id="sim">Simuler une série</button></div>
 </div>
 <h2 style="margin-top:22px">Les cotes à tracer</h2>
 <p class="chapo" style="margin-bottom:6px">Modifiez le <b>diamètre</b> ou le <b>décalage</b> d'une cible : le plan, la vue du tireur et les autres colonnes se recalculent. Le centre se déduit du haut des cibles (152 cm par défaut). Les décalages se mesurent depuis l'axe du tireur.</p>
 <div class="tableau"><table>
  <thead><tr><th>Cible</th><th>Diamètre</th><th>Décalage</th><th>Centre</th><th>Distance de visée</th><th>Taille apparente</th></tr></thead>
  <tbody id="tb"></tbody></table></div>
 
 <h2 style="margin-top:22px">Repères du parcours officiel</h2>
 <p class="chapo" style="margin-bottom:6px">Sur le parcours officiel, la distance de tir et le décalage latéral se mesurent depuis le centre du carré du tireur, sur son axe. Les cibles sont toutes des gongs, à des distances différentes : la version en salle les remplace par des cibles de plus en plus petites, toutes sur la clôture, pour garder la même taille apparente.</p>
 <div class="tableau"><table>
  <thead><tr><th>Cible</th><th>Gong</th><th>Distance de tir</th><th>Décalage</th><th>Visée</th><th>Taille apparente</th><th>Version en salle</th></tr></thead>
  <tbody id="tbo"></tbody></table></div>
 <h2 style="margin-top:22px">Tracer le parcours, pas à pas</h2>
 <ol class="etapes-trace">
  <li><b>Marquer le carré du tireur</b>Un carré de 91 × 91 cm. Son centre est l'axe de référence.</li>
  <li><b>Tendre la ligne de la clôture</b>À <span id="t-dist">7,5 m</span> du centre du carré, parallèle au fond de la salle.</li>
  <li><b>Repérer les décalages</b><span id="liste-dec"></span></li>
  <li><b>Fixer les cibles</b>Le haut de chaque cible à <span id="t-haut">152 cm</span> : le centre se déduit du diamètre (tableau ci-dessus).</li>
 </ol>
 <div class="encart" id="largeur"></div>
 `;

const DEF=[{n:"1",d:20.8,x:-2.56},{n:"2",d:17.4,x:-0.71},{n:"3",d:13.9,x:0.57},{n:"4",d:11.6,x:1.42},{n:"Stop plate",d:35.7,x:6.11,stop:true}];
const CIBLES=DEF.map(c=>({...c}));
const OFFI=[{n:"1",d:25.4,D:9.14,x:-3.12,yd:"10 yards"},{n:"2",d:25.4,D:10.97,x:-1.04,yd:"12 yards"},{n:"3",d:25.4,D:13.72,x:1.04,yd:"15 yards"},{n:"4",d:25.4,D:16.46,x:3.12,yd:"18 yards"},{n:"Stop plate",d:30.5,D:6.40,x:5.21,yd:"7 yards",stop:true}];
OFFI.forEach(o=>{o.f=o.D;o.vis=Math.hypot(o.D,o.x);o.mrad=2*Math.atan(o.d/200/o.vis)*1000});
const $=id=>document.getElementById(id);
const fr=(v,n=2)=>v.toFixed(n).replace(".",",");
const sg=v=>(v>0?"+":v<0?"−":"")+fr(Math.abs(v));
let vue="plan",courant=-1,HAUT=152;
const centre=c=>HAUT-c.d/2;
const bornes=lat=>{const xs=CIBLES.map(c=>c.x);if($("off").checked)OFFI.forEach(o=>xs.push(o.x));return [Math.min(...xs,lat)-0.9,Math.max(...xs,lat)+0.9]};
const minmax=()=>{const xs=CIBLES.map(c=>c.x);return [Math.min(...xs),Math.max(...xs)]};

function plan(dist,lat){
 const off=$("off").checked,[X0,X1]=bornes(lat),[mn,mx]=minmax();
 const fmax=Math.max(dist,...(off?OFFI.map(o=>o.f):[0]));
 const S=Math.min(80,820/(fmax+1.6)),W=(X1-X0)*S,ybase=(fmax+0.9)*S+50,H=ybase+0.9*S/2+34,px=x=>(x-X0)*S,py=f=>ybase-f*S;
 const yf=py(dist);
 let s=`<svg class="diy" viewBox="0 0 ${W} ${H}" role="img" aria-label="Plan vu de dessus : clôture avec les cibles, carré du tireur et repères du parcours officiel">`;
 s+=`<line x1="${px(0)}" y1="${py(fmax+0.6)}" x2="${px(0)}" y2="${ybase}" stroke="var(--trait)" stroke-dasharray="2 5"/><text x="${px(0)+6}" y="${py(fmax+0.6)+10}">Axe du tireur</text>`;
 s+=`<rect x="${px(mn)-30}" y="${yf-7}" width="${(mx-mn)*S+60}" height="14" rx="4" fill="var(--mur)"/>`;
 s+=`<text x="${px(mn)-30}" y="${yf-34}" class="t-fort">Clôture (version en salle)</text>`;
 const cy=ybase,sx=px(lat),c91=0.91*S;
 if(off){
  OFFI.forEach(o=>{
   const x=px(o.x),y=py(o.f),r=Math.max(5,o.d/200*S);
   s+=`<line x1="${px(0)}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--orange)" stroke-width="1" stroke-dasharray="2 4" opacity=".8"/>`;
   s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="var(--orange)" stroke-width="2" stroke-dasharray="4 3"/>`;
   s+=`<text x="${x}" y="${y-r-6}" text-anchor="middle" style="fill:var(--orange);font-weight:600">${o.stop?"Stop":o.n} · ${fr(o.D)} m</text>`;
   s+=`<text x="${x}" y="${y+r+15}" text-anchor="middle" style="fill:var(--orange)">${sg(o.x)}</text>`;
  });
 }
 CIBLES.forEach((c,i)=>{
  const x=px(c.x),on=i===courant,r=Math.max(5,c.d/200*S);
  s+=`<line x1="${x}" y1="${yf}" x2="${sx}" y2="${cy}" stroke="${on?"var(--vert)":"var(--discret)"}" stroke-width="${on?2.5:1}" stroke-dasharray="${on?"0":"4 5"}" opacity="${on?1:.7}"/>`;
  s+=`<circle cx="${x}" cy="${yf}" r="${r}" fill="${c.stop?"var(--orange)":"var(--impact)"}" stroke="${on?"var(--texte)":"none"}" stroke-width="2.5"/>`;
  s+=`<text x="${x}" y="${yf+r+16}" text-anchor="middle" class="t-fort">${c.stop?"Stop":c.n} ${sg(c.x)}</text>`;
 });
 s+=`<rect x="${sx-c91/2}" y="${cy-c91/2}" width="${c91}" height="${c91}" rx="6" fill="var(--vert)" opacity=".9"/>`;
 s+=`<text x="${sx}" y="${cy+5}" text-anchor="middle" style="fill:var(--sur-accent);font-weight:700">Tireur</text>`;
 s+=`<line x1="12" y1="${yf}" x2="12" y2="${cy}" stroke="var(--discret)"/><text x="20" y="${(yf+cy)/2}" class="t-fort">${fr(dist,1)} m</text>`;
 return s+"</svg>";
}
function tireur(dist,lat){
 const [X0,X1]=bornes(lat),[mn,mx]=minmax(),S=100,W=(X1-X0)*S,sol=300,H=sol+30,px=x=>(x-X0)*S,py=cm=>sol-cm*S/100;
 let s=`<svg class="diy" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vue depuis le tireur : cibles sur la clôture de 2 mètres">`;
 s+=`<rect x="${px(mn)-40}" y="${py(200)}" width="${(mx-mn)*S+80}" height="${200*S/100}" rx="4" fill="var(--voile)" stroke="var(--mur)"/>`;
 s+=`<text x="${px(mn)-34}" y="${py(200)-6}">Clôture, h. 2 m</text>`;
 s+=`<line x1="0" y1="${sol}" x2="${W}" y2="${sol}" stroke="var(--discret)"/>`;
 s+=`<line x1="${px(mn)-40}" y1="${py(HAUT)}" x2="${px(mx)+60}" y2="${py(HAUT)}" stroke="var(--orange)" stroke-dasharray="5 5"/><text x="${px(mx)+50}" y="${py(HAUT)-6}" text-anchor="end" style="fill:var(--orange)">Haut des cibles : ${HAUT} cm</text>`;
 if($("off").checked)OFFI.forEach(o=>{const x=px(o.x);
  s+=`<line x1="${x}" y1="${py(0)}" x2="${x}" y2="${py(200)}" stroke="var(--orange)" stroke-dasharray="3 5"/>`;
  s+=`<text x="${x}" y="${py(200)-24}" text-anchor="middle" style="fill:var(--orange);font-weight:600">${o.stop?"Stop":o.n} ${sg(o.x)}</text>`});
 CIBLES.forEach((c,i)=>{
  const on=i===courant,x=px(c.x),r=c.d/2*S/100;
  s+=`<circle cx="${x}" cy="${py(centre(c))}" r="${r}" fill="${c.stop?"var(--orange)":"var(--impact)"}" stroke="${on?"var(--texte)":"none"}" stroke-width="3"/>`;
  s+=`<text x="${x}" y="${py(centre(c))+4}" text-anchor="middle" style="fill:#fff;font-weight:700">${c.stop?"":c.n}</text>`;
  s+=`<text x="${x}" y="${py(centre(c))+r+16}" text-anchor="middle">${fr(c.d,1)} cm</text>`;
 });
 s+=`<line x1="${px(lat)}" y1="${sol}" x2="${px(lat)}" y2="${sol+22}" stroke="var(--vert)" stroke-width="3"/><text x="${px(lat)}" y="${sol+22}" text-anchor="middle" style="fill:var(--vert);font-weight:700">Tireur</text>`;
 return s+"</svg>";
}
/* Le tableau est construit une fois : les champs restent actifs pendant la saisie, seules les colonnes calculées se mettent à jour. */
function construireTableau(){
 $("tb").innerHTML=CIBLES.map((c,i)=>`<tr class="${c.stop?"stop":""}"><td>${c.n}</td>
  <td><input type="number" id="d${i}" min="3" max="80" step="0.1" value="${c.d}" aria-label="Diamètre de la cible ${c.n} en cm"><span class="u">cm</span></td>
  <td><input type="number" id="x${i}" min="-6" max="9" step="0.01" value="${c.x}" aria-label="Décalage de la cible ${c.n} en m, négatif à gauche"><span class="u">m</span></td>
  <td class="cote" id="c${i}"></td><td class="cote" id="v${i}"></td><td class="cote" id="a${i}"></td></tr>`).join("");
 CIBLES.forEach((c,i)=>{
  $("d"+i).oninput=e=>{const v=parseFloat(e.target.value.replace(",","."));if(v>0){c.d=v;rendre()}};
  $("x"+i).oninput=e=>{const v=parseFloat(e.target.value.replace(",","."));if(!isNaN(v)){c.x=v;rendre()}};
 });
}
function calculs(dist,lat){
 CIBLES.forEach((c,i)=>{
  const vis=Math.hypot(dist,c.x-lat),mrad=2*Math.atan(c.d/200/vis)*1000;
  $("c"+i).textContent=fr(centre(c),1)+" cm";$("v"+i).textContent=fr(vis)+" m";$("a"+i).textContent=fr(mrad,1)+" mrad ("+fr(mrad*3.4377,0)+" MOA)";
 });
 $("tbo").innerHTML=OFFI.map((o,i)=>{const c=CIBLES[i],vis=Math.hypot(dist,c.x-lat),m=2*Math.atan(c.d/200/vis)*1000,e=(m/o.mrad-1)*100;
  return `<tr class="${o.stop?"stop":""}"><td>${o.n}</td><td>${fr(o.d,1)} cm</td><td>${fr(o.D)} m (${o.yd})</td><td>${fr(Math.abs(o.x))} m ${o.x<0?"à gauche":"à droite"}</td><td>${fr(o.vis)} m</td><td>${fr(o.mrad,1)} mrad</td><td>${fr(m,1)} mrad (${e>0?"+":e<0?"−":""}${fr(Math.abs(e),0)} %)</td></tr>`}).join("");
 const [mn,mx]=minmax();
 $("largeur").textContent="Le plan fait "+fr(mx-mn)+" m de large entre la première cible et la stop plate. Vérifiez la place disponible avant de tracer.";
 $("liste-dec").textContent=CIBLES.map(c=>(c.stop?"stop plate : ":"cible "+c.n+" : ")+fr(Math.abs(c.x))+" m "+(c.x<0?"à gauche":"à droite")).join(", ")+".";
 $("t-dist").textContent=fr(dist,1)+" m";$("t-haut").textContent=HAUT+" cm";
}
function rendre(){
 const dist=+$("dist").value,lat=+$("lat").value;HAUT=+$("haut").value;
 $("oDist").textContent=fr(dist,1)+" m";$("oLat").textContent=sg(lat)+" m";$("oHaut").textContent=HAUT+" cm";
 $("vue").innerHTML=vue==="plan"?plan(dist,lat):tireur(dist,lat);
 calculs(dist,lat);
 $("leg").textContent=courant<0?"En orange : le parcours officiel, mesuré depuis l'axe du tireur. En couleur pleine : votre version en salle.":
  (courant<CIBLES.length-1?"Cible "+CIBLES[courant].n+" : visée à "+fr(Math.hypot(dist,CIBLES[courant].x-lat))+" m, "+fr(CIBLES[courant].d,1)+" cm de diamètre.":"Stop plate : la série est terminée, le chrono s'arrête.");
}
function bascule(v){vue=v;$("bPlan").setAttribute("aria-pressed",v==="plan");$("bTireur").setAttribute("aria-pressed",v==="tireur");rendre()}
$("bPlan").onclick=()=>bascule("plan");$("bTireur").onclick=()=>bascule("tireur");
$("off").onchange=rendre;$("dist").oninput=rendre;$("lat").oninput=rendre;$("haut").oninput=rendre;
$("raz").onclick=()=>{$("dist").value=7.5;$("lat").value=0;$("haut").value=152;courant=-1;DEF.forEach((c,i)=>{CIBLES[i].d=c.d;CIBLES[i].x=c.x});construireTableau();rendre()};
$("sim").onclick=()=>{clearInterval(timerHandle);courant=-1;let i=0;timerHandle=setInterval(()=>{courant=i;rendre();i++;if(i>=CIBLES.length)clearInterval(timerHandle)},900)};
construireTableau();rendre();
}

/* ---------- Rendu ---------- */
const app=document.getElementById("app");
let timerHandle=null;
function accueil(){
 app.innerHTML=`<h1>Tout savoir sur TARAN+</h1><p class="chapo">Choisissez une rubrique, comme dans le sommaire de l'appli. Chaque page explique pas à pas, avec une animation.</p>
 <div class="grille">${ORDRE.map(k=>`<a class="tuile" href="#/${k}"><span class="ico">${PAGES[k].ico}</span><b>${PAGES[k].nom}</b><small>${PAGES[k].court}</small></a>`).join("")}</div>`;
}
function page(k){
 const d=PAGES[k]; if(!d) return accueil();
 if(d.custom) return pageDiy();
 let i=0;
 app.innerHTML=`<a class="retour" href="#/">← Sommaire</a><h1>${d.ico} ${d.nom}</h1><p class="chapo">${d.chapo}</p>
 <div class="scene"><div id="sc"></div><div class="etapes" id="pts"></div><h2 id="et" style="margin-top:10px"></h2><p class="legende" id="ex" style="font-size:15px;color:var(--texte);margin:0 0 4px"></p>
 <div class="nav"><button class="btn" id="pr">Précédent</button><button class="btn pri" id="su">Suivant</button></div></div>
 ${d.etapes.some(e=>e.lien)?`<p><a class="retour" href="#/calibrage">Voir le calibrage en détail →</a></p>`:""}
 ${d.note?`<div class="encart">${d.note}</div>`:""}`;
 const $=id=>document.getElementById(id);
 function montrer(){
  clearInterval(timerHandle);
  const e=d.etapes[i];
  $("sc").innerHTML=scene(e.s,e.p);
  $("pts").innerHTML=d.etapes.map((_,j)=>`<button class="${j===i?"on":""}" aria-label="Étape ${j+1}" data-j="${j}"></button>`).join("");
  $("et").textContent=(i+1)+". "+e.t; $("ex").textContent=e.x;
  $("pr").disabled=i===0; $("su").textContent=i===d.etapes.length-1?"Recommencer":"Suivant";
  $("pts").querySelectorAll("button").forEach(b=>b.onclick=()=>{i=+b.dataset.j;montrer()});
  if(e.s==="timer") lancerTimer(i);
 }
 $("pr").onclick=()=>{if(i>0){i--;montrer()}};
 $("su").onclick=()=>{i=(i+1)%d.etapes.length;montrer()};
 montrer();
}
function lancerTimer(etape){
 const lcd=document.getElementById("lcd"),etat=document.getElementById("lcdEtat"),g=document.getElementById("coups");
 const tirs=[1.12,1.38,1.31,1.47,1.29]; let t=0,n=0;
 etat.textContent=etape===0?"Mode : 3 s / 7 s":etape===1?"Attention…":"Série en cours";
 if(etape===0){lcd.textContent="3,00";return}
 if(etape===1){let c=0;timerHandle=setInterval(()=>{c=(c+1)%4;etat.textContent=c<3?"Attention…":"BIP !";lcd.textContent=c<3?"0,00":"BIP"},700);return}
 g.innerHTML="";
 timerHandle=setInterval(()=>{
  if(n>=tirs.length){ if(etape===3){etat.textContent="Moyenne 1,31 s · meilleur 1,12 s"} return}
  t+=tirs[n]; lcd.textContent=t.toFixed(2).replace(".",",");
  g.insertAdjacentHTML("beforeend",`<circle cx="${60+n*50}" cy="136" r="5" fill="var(--vert)"/>`);
  etat.textContent="Coup "+(n+1)+" : "+tirs[n].toFixed(2).replace(".",",")+" s"; n++;
 },900);
}
function route(){const k=location.hash.replace(/^#\/?/,"");clearInterval(timerHandle);k?page(k):accueil();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);route();
</script>
